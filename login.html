<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- sweetAlert2 CSS -->
    <link rel="stylesheet" href="./LIBRERIAS/sweetAlert2/css/sweetalert2.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <div class="error" id="errorMessage">Usuario o contraseña incorrectos</div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
    <!-- Jquery -->
    <script src="./LIBRERIAS/jquery/jquery-3.7.1.min.js"></script>

    <!-- sweetAlert2 JS -->
    <script src="./LIBRERIAS/sweetAlert2/js/sweetalert2.all.js"></script>
    <script src="./LIBRERIAS/sweetAlert2/js/sweetalert2.all.min.js"></script>

    <!-- JS -->
    <script src="./js/login.js"></script>
</body>
</html>
